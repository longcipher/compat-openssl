[package]
name = "downstream-postgres-native-tls"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
backend-boring = ["openssl/backend-boring"]
backend-openssl = ["openssl/backend-openssl"]
default = []

[patch.crates-io]
openssl = { path = "../../../crates/openssl" }
openssl-sys = { path = "../../../crates/openssl-sys" }

[dependencies]
native-tls = "0.2.18"
openssl = { version = "0.10.76", default-features = false }
postgres-native-tls = "0.5.3"

[package.metadata.cargo-machete]
ignored = ["openssl"]
