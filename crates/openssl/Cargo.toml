[package]
name = "openssl"
version = "0.10.76"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "compat-openssl Phase 1 shim for the OpenSSL backend"

[features]
backend-boring = ["dep:boring", "dep:openssl-sys", "openssl-sys/backend-boring"]
backend-openssl = [
    "dep:openssl-sys",
    "dep:real-backend-openssl",
    "openssl-sys/backend-openssl",
]
default = ["backend-boring"]

[dependencies]
boring = { workspace = true, optional = true }
openssl-sys = { workspace = true, default-features = false, optional = true }
real-backend-openssl = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[package.metadata.cargo-machete]
ignored = ["openssl-sys"]
