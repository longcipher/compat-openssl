[package]
name = "openssl-sys"
version = "0.9.112"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "compat-openssl Phase 1 shim for the OpenSSL backend"
links = "openssl"
build = "build.rs"

[features]
backend-boring = ["dep:boring-sys"]
backend-openssl = ["dep:real-backend-openssl-sys"]
default = ["backend-boring"]

[dependencies]
boring-sys = { workspace = true, optional = true }
real-backend-openssl-sys = { workspace = true, optional = true }
